map $http_upgrade $cockpit_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9090 ssl default_server;
    listen [::]:9090 ssl default_server;
    server_name _;

    ssl_certificate /etc/cockpit/ws-certs.d/0-self-signed.cert;
    ssl_certificate_key /etc/cockpit/ws-certs.d/0-self-signed.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 500M;

    location ~ ^/code-server/(?<uid>[0-9]+)(?<rest>/.*)?$ {
        proxy_pass http://unix:/run/code-server/$uid.sock:$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cockpit_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://unix:/run/cockpit/cockpit.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cockpit_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
