<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Sharing</title>
    <script type="text/javascript">
        document.write('<base href="' + window.location.pathname.slice(0,-('index.html').length) + '"/>');
    </script>
    <script src="../base1/cockpit.js"></script>
    <script type="text/javascript">
        (function () {
            // Clean up legacy custom storage keys
            try {
                localStorage.removeItem('cockpit_zfs_theme');
                localStorage.removeItem('cockpit_filesharing_theme');
            } catch (e) {}

            function updateTheme(forcedTheme) {
                var shellStyle = forcedTheme;
                if (typeof shellStyle !== 'string') {
                    try {
                        shellStyle = localStorage.getItem('shell:style');
                    } catch (e) {}
                }
                if (!shellStyle || shellStyle === 'null' || shellStyle === 'undefined') {
                    shellStyle = 'auto';
                }

                var isDark = false;
                if (shellStyle === 'dark') {
                    isDark = true;
                } else if (shellStyle === 'light') {
                    isDark = false;
                } else {
                    // "auto" mode: follow OS / Cockpit shell
                    try {
                        if (window.parent && window.parent !== window && window.parent.document && window.parent.document.documentElement) {
                            var pCls = window.parent.document.documentElement.classList;
                            if (pCls.contains('pf-v6-theme-dark') || pCls.contains('pf-v5-theme-dark') || pCls.contains('theme-dark')) {
                                isDark = true;
                            }
                        }
                    } catch (e) {}

                    if (!isDark && window.matchMedia) {
                        try {
                            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                                isDark = true;
                            }
                        } catch (e) {}
                    }
                }

                var docEl = document.documentElement;
                if (isDark) {
                    docEl.classList.add('pf-v5-theme-dark');
                    docEl.classList.add('pf-v6-theme-dark');
                    docEl.classList.remove('theme-light');
                    docEl.classList.remove('pf-m-light');
                } else {
                    docEl.classList.remove('pf-v5-theme-dark');
                    docEl.classList.remove('pf-v6-theme-dark');
                    if (shellStyle === 'light') {
                        docEl.classList.add('theme-light');
                        docEl.classList.add('pf-m-light');
                    } else {
                        docEl.classList.remove('theme-light');
                        docEl.classList.remove('pf-m-light');
                    }
                }
            }

            window.addEventListener('storage', function (e) {
                if (e.key === 'shell:style') {
                    updateTheme();
                }
            });

            window.addEventListener('cockpit-style', function (e) {
                if (e instanceof CustomEvent && e.detail) {
                    updateTheme(e.detail.style || e.detail.theme);
                } else {
                    updateTheme();
                }
            });

            if (window.matchMedia) {
                try {
                    var mq = window.matchMedia('(prefers-color-scheme: dark)');
                    if (mq.addEventListener) {
                        mq.addEventListener('change', function () { updateTheme(); });
                    } else if (mq.addListener) {
                        mq.addListener(function () { updateTheme(); });
                    }
                } catch (e) {}
            }

            try {
                if (window.parent && window.parent !== window && window.parent.document && window.parent.document.documentElement) {
                    var observer = new MutationObserver(function () {
                        updateTheme();
                    });
                    observer.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['class'] });
                }
            } catch (e) {}

            setInterval(updateTheme, 1000);

            updateTheme();
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
