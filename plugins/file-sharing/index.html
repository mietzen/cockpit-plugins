<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Sharing</title>
    <script type="text/javascript">
        document.write('<base href="' + window.location.pathname.slice(0,-('index.html').length) + '"/>');
    </script>
    <script src="../base1/cockpit.js"></script>
    <script type="text/javascript">
        (function () {
            try {
                localStorage.removeItem('cockpit_zfs_theme');
                localStorage.removeItem('cockpit_filesharing_theme');
            } catch (e) {}

            function updateTheme(forcedTheme) {
                var isDark = false;
                var parentFound = false;

                // 1. When inside Cockpit iframe, Cockpit host shell is the source of truth
                try {
                    if (window.parent && window.parent !== window && window.parent.document && window.parent.document.documentElement) {
                        parentFound = true;
                        var pCls = window.parent.document.documentElement.classList;
                        if (pCls.contains('pf-v6-theme-dark') || pCls.contains('pf-v5-theme-dark') || pCls.contains('theme-dark')) {
                            isDark = true;
                        } else {
                            isDark = false;
                        }
                    }
                } catch (e) {}

                // 2. Fallback when standalone or parent frame inaccessible
                if (!parentFound) {
                    var shellStyle = forcedTheme;
                    if (typeof shellStyle !== 'string') {
                        try {
                            shellStyle = localStorage.getItem('shell:style');
                        } catch (e) {}
                    }
                    if (shellStyle === 'dark') {
                        isDark = true;
                    } else if (shellStyle === 'light') {
                        isDark = false;
                    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        isDark = true;
                    }
                }

                var docEl = document.documentElement;
                if (isDark) {
                    docEl.classList.add('pf-v5-theme-dark', 'pf-v6-theme-dark', 'theme-dark');
                    docEl.classList.remove('theme-light', 'pf-m-light', 'pf-v5-theme-light', 'pf-v6-theme-light');
                } else {
                    docEl.classList.remove('pf-v5-theme-dark', 'pf-v6-theme-dark', 'theme-dark');
                    docEl.classList.add('theme-light', 'pf-m-light', 'pf-v5-theme-light', 'pf-v6-theme-light');
                }
            }

            window.addEventListener('storage', function (e) {
                if (e.key === 'shell:style') {
                    updateTheme();
                }
            });

            window.addEventListener('cockpit-style', function (e) {
                if (e instanceof CustomEvent && e.detail) {
                    updateTheme(e.detail.style || e.detail.theme);
                } else {
                    updateTheme();
                }
            });

            if (window.matchMedia) {
                try {
                    var mq = window.matchMedia('(prefers-color-scheme: dark)');
                    if (mq.addEventListener) {
                        mq.addEventListener('change', function () { updateTheme(); });
                    } else if (mq.addListener) {
                        mq.addListener(function () { updateTheme(); });
                    }
                } catch (e) {}
            }

            try {
                if (window.parent && window.parent !== window && window.parent.document && window.parent.document.documentElement) {
                    var observer = new MutationObserver(function () {
                        updateTheme();
                    });
                    observer.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['class'] });
                }
            } catch (e) {}

            setInterval(updateTheme, 500);
            updateTheme();
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
