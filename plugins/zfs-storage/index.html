<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZFS Storage</title>
    <script type="text/javascript">
        document.write('<base href="' + window.location.pathname.slice(0,-('index.html').length) + '"/>');
    </script>
    <script src="../base1/cockpit.js"></script>
    <script type="text/javascript">
        (function () {
            function updateTheme(forcedTheme) {
                const preference = localStorage.getItem('cockpit_zfs_theme') || localStorage.getItem('cockpit_filesharing_theme') || 'auto';
                let isDark = false;
                if (preference === 'dark') {
                    isDark = true;
                } else if (preference === 'light') {
                    isDark = false;
                } else {
                    const shellTheme = forcedTheme || localStorage.getItem('shell:style') || 'auto';
                    if (shellTheme === 'dark') {
                        isDark = true;
                    } else if (shellTheme === 'light') {
                        isDark = false;
                    } else {
                        // "auto" mode: check parent document class or prefers-color-scheme
                        try {
                            if (window.parent && window.parent.document && window.parent.document.documentElement) {
                                const pCls = window.parent.document.documentElement.classList;
                                if (pCls.contains('pf-v6-theme-dark') || pCls.contains('pf-v5-theme-dark') || pCls.contains('theme-dark')) {
                                    isDark = true;
                                }
                            }
                        } catch (e) {}
                        if (!isDark && window.matchMedia) {
                            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                        }
                    }
                }

                if (isDark) {
                    document.documentElement.classList.add('pf-v5-theme-dark');
                    document.documentElement.classList.add('pf-v6-theme-dark');
                    document.documentElement.classList.remove('pf-v5-theme-light');
                    document.documentElement.classList.remove('pf-v6-theme-light');
                } else {
                    document.documentElement.classList.remove('pf-v5-theme-dark');
                    document.documentElement.classList.remove('pf-v6-theme-dark');
                    document.documentElement.classList.add('pf-v5-theme-light');
                    document.documentElement.classList.add('pf-v6-theme-light');
                }
            }

            window.addEventListener('storage', function (e) {
                if (e.key === 'shell:style' || e.key === 'cockpit_zfs_theme' || e.key === 'cockpit_filesharing_theme') {
                    updateTheme();
                }
            });

            window.addEventListener('cockpit-style', function (e) {
                if (e instanceof CustomEvent && e.detail) {
                    updateTheme(e.detail.style || e.detail.theme);
                } else {
                    updateTheme();
                }
            });

            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
                    updateTheme();
                });
            }

            // Sync parent frame DOM class changes in real time
            try {
                if (window.parent && window.parent.document && window.parent.document.documentElement) {
                    const observer = new MutationObserver(function () {
                        updateTheme();
                    });
                    observer.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['class'] });
                }
            } catch (e) {}

            updateTheme();
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
