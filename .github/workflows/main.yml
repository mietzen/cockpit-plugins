name: Cockpit Plugins CI & APT/RPM Repository

on:
  push:
    branches:
      - main
    tags:
      - '*-v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Plugins, Test & Package (.deb & .rpm)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Python Test Dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run Backend Unit Tests
        run: |
          PYTHONPATH=plugins/zfs-storage pytest plugins/zfs-storage/backend/tests

      - name: Install Packaging Tools (RPM & DPKG)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm dpkg-dev

      - name: Build Plugins & Packages (.deb & .rpm)
        run: |
          mkdir -p dist-debs dist-rpms
          for plugin in plugins/*; do
            if [ -d "$plugin" ] && [ -f "$plugin/package.json" ]; then
              echo "==> Building and packaging plugin: $plugin"
              npm --prefix "$plugin" install
              npm --prefix "$plugin" run build
              ./tools/build_deb.sh "$plugin" auto dist-debs
              ./tools/build_rpm.sh "$plugin" auto dist-rpms
            fi
          done

      - name: Upload Debian Packages
        uses: actions/upload-artifact@v7
        with:
          name: deb-packages
          path: dist-debs/*.deb
          retention-days: 7

      - name: Upload RPM Packages
        uses: actions/upload-artifact@v7
        with:
          name: rpm-packages
          path: dist-rpms/*.rpm
          retention-days: 7

  e2e:
    name: End-to-End Playwright Tests (Live ZFS & Cockpit)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Download Built .deb Packages
        uses: actions/download-artifact@v8
        with:
          name: deb-packages
          path: dist-debs

      - name: Setup ZFS & Cockpit Test Environment
        run: |
          sudo bash plugins/zfs-storage/e2e/setup_test_env.sh

      - name: Install Playwright & Browsers
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run E2E Playwright Test Suite
        run: |
          COCKPIT_URL=https://127.0.0.1:9090 npx playwright test

      - name: Upload E2E Test Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-results
          path: test-results/
          retention-days: 14

  deploy-pages:
    name: Assemble & Deploy Repositories to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: [build, e2e]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download Built Packages
        uses: actions/download-artifact@v8
        with:
          name: deb-packages
          path: dist-debs

      - name: Download Built RPM Packages
        uses: actions/download-artifact@v8
        with:
          name: rpm-packages
          path: dist-rpms

      - name: Assemble APT & RPM Repositories
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          python3 tools/generate_apt_repo.py --deb-dir dist-debs --rpm-dir dist-rpms --output-dir pages --owner ${{ github.repository_owner }} --repo ${{ github.event.repository.name }}
          python3 tools/generate_rpm_repo.py --rpm-dir dist-rpms --output-dir pages/rpm --owner ${{ github.repository_owner }} --repo ${{ github.event.repository.name }}

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  github-release:
    name: Publish Tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs: [build, e2e]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Built Packages
        uses: actions/download-artifact@v8
        with:
          name: deb-packages
          path: dist-debs

      - name: Download Built RPM Packages
        uses: actions/download-artifact@v8
        with:
          name: rpm-packages
          path: dist-rpms

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Creating GitHub Release for $TAG_NAME..."
          gh release create "$TAG_NAME" \
            dist-debs/*.deb \
            dist-rpms/*.rpm \
            --title "$TAG_NAME" \
            --generate-notes
