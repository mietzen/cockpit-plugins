name: Cockpit Plugins CI & APT Repository

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Plugins & Debian Packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: zfs-storage/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build zfs-storage plugin
        run: |
          make build-zfs

      - name: Build Debian Packages (.deb)
        run: |
          make deb

      - name: Upload Debian Packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: dist-debs/*.deb
          retention-days: 7

  e2e:
    name: End-to-End Playwright Tests (Live ZFS & Cockpit)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Built .deb Packages
        uses: actions/download-artifact@v4
        with:
          name: deb-packages
          path: dist-debs

      - name: Setup ZFS & Cockpit Test Environment
        run: |
          sudo bash e2e/setup_test_env.sh

      - name: Install Playwright & Browsers
        working-directory: zfs-storage
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run E2E Playwright Test Suite
        working-directory: zfs-storage
        run: |
          COCKPIT_URL=https://127.0.0.1:9090 npx playwright test --config ../e2e/playwright.config.ts

      - name: Upload E2E Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: zfs-storage/playwright-report/
          retention-days: 14

  deploy-apt-pages:
    name: Assemble & Deploy APT Repository to GitHub Pages
    if: github.event_name == push && github.ref == refs/heads/main
    runs-on: ubuntu-24.04
    needs: [build, e2e]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Built .deb Packages
        uses: actions/download-artifact@v4
        with:
          name: deb-packages
          path: dist-debs

      - name: Assemble APT Repository & Landing Page
        run: |
          python3 tools/generate_apt_repo.py --deb-dir dist-debs --output-dir pages --owner ${{ github.repository_owner }} --repo ${{ github.event.repository.name }}

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
