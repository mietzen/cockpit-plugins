name: Cockpit Plugins CI & APT/RPM Repository

on:
  push:
    branches:
      - main
    tags:
      - '*-v*'
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  code-quality: write

jobs:
  build:
    name: Build & Package Matrix (${{ matrix.plugin }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        plugin: [zfs-storage, file-sharing]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Python Test Dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run Backend Unit Tests with Coverage
        run: |
          mkdir -p coverage-python
          PYTHONPATH=packages/common/python:plugins/${{ matrix.plugin }}:plugins/${{ matrix.plugin }}/backend:tools pytest \
            --cov=plugins/${{ matrix.plugin }}/backend \
            --cov=packages/common/python/cockpit_common \
            --cov-report=lcov:coverage-python/coverage-python-${{ matrix.plugin }}.lcov \
            --cov-report=xml:coverage-python/coverage-python-${{ matrix.plugin }}.xml \
            --cov-report=term-missing \
            plugins/${{ matrix.plugin }}/backend/tests packages/common/python/tests tools/tests

      - name: Upload Python Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.plugin }}
          path: coverage-python/*.lcov
          retention-days: 7

      - name: Install Packaging Tools (RPM & DPKG)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm dpkg-dev

      - name: Install Workspace Dependencies & Build Plugin
        run: |
          npm ci
          VITE_COVERAGE=true npm --prefix plugins/${{ matrix.plugin }} run build

      - name: Package Plugin (.deb & .rpm) - Build Pass 1
        run: |
          mkdir -p dist-debs dist-rpms
          ./tools/build_deb.sh plugins/${{ matrix.plugin }} auto dist-debs
          ./tools/build_rpm.sh plugins/${{ matrix.plugin }} auto dist-rpms

      - name: Reproducible Build Gate - Build Pass 2 & Hash Verification
        run: |
          mkdir -p dist-debs-repro dist-rpms-repro
          ./tools/build_deb.sh plugins/${{ matrix.plugin }} auto dist-debs-repro
          ./tools/build_rpm.sh plugins/${{ matrix.plugin }} auto dist-rpms-repro

          echo "==> Verifying bit-for-bit Debian package reproducibility..."
          for deb in dist-debs/*.deb; do
            base_deb=$(basename "$deb")
            repro_deb="dist-debs-repro/$base_deb"
            if [ -f "$repro_deb" ]; then
              sha_orig=$(sha256sum "$deb" | awk '{print $1}')
              sha_repro=$(sha256sum "$repro_deb" | awk '{print $1}')
              echo "$base_deb Pass 1: $sha_orig"
              echo "$base_deb Pass 2: $sha_repro"
              if [ "$sha_orig" != "$sha_repro" ]; then
                echo "❌ Non-reproducible Debian package detected for $base_deb"
                cmp -l "$deb" "$repro_deb" | head -n 30
                exit 1
              fi
            fi
          done

          echo "==> Verifying bit-for-bit RPM package reproducibility..."
          for rpm in dist-rpms/*.rpm; do
            base_rpm=$(basename "$rpm")
            repro_rpm="dist-rpms-repro/$base_rpm"
            if [ -f "$repro_rpm" ]; then
              sha_orig=$(sha256sum "$rpm" | awk '{print $1}')
              sha_repro=$(sha256sum "$repro_rpm" | awk '{print $1}')
              echo "$base_rpm Pass 1: $sha_orig"
              echo "$base_rpm Pass 2: $sha_repro"
              if [ "$sha_orig" != "$sha_repro" ]; then
                echo "❌ Non-reproducible RPM package detected for $base_rpm"
                cmp -l "$rpm" "$repro_rpm" | head -n 30
                exit 1
              fi
            fi
          done
          echo "✅ Reproducibility gate passed: all packages are 100% deterministic bit-for-bit."

      - name: Upload Scoped Debian Artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.plugin }}
          path: dist-debs/*.deb
          retention-days: 7

      - name: Upload Scoped RPM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.plugin }}
          path: dist-rpms/*.rpm
          retention-days: 7

  e2e:
    name: E2E Playwright Tests Matrix (${{ matrix.plugin }})
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        plugin: [zfs-storage, file-sharing]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Download Built .deb Package for Matrix Target
        uses: actions/download-artifact@v8
        with:
          name: deb-${{ matrix.plugin }}
          path: dist-debs

      - name: Setup Cockpit Test Environment
        run: |
          sudo bash tools/setup_e2e_env.sh

      - name: Install Playwright & Browsers
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run E2E Playwright Suite for ${{ matrix.plugin }}
        run: |
          COCKPIT_URL=https://127.0.0.1:9090 npx playwright test plugins/${{ matrix.plugin }}/e2e/ --project=chromium

      - name: Generate E2E Code Coverage Report
        if: always()
        run: |
          mkdir -p coverage-e2e-${{ matrix.plugin }}
          if [ -d ".nyc_output" ] && [ "$(ls -A .nyc_output 2>/dev/null)" ]; then
            npx nyc report --reporter=lcov --reporter=cobertura --reporter=text-summary --report-dir=coverage-e2e-${{ matrix.plugin }} || true
          fi

      - name: Upload E2E Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-e2e-${{ matrix.plugin }}
          path: coverage-e2e-${{ matrix.plugin }}
          retention-days: 7

      - name: Upload E2E Test Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ matrix.plugin }}
          path: test-results/
          retention-days: 14

  check-run:
    name: Check-Run
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      - build
      - e2e
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download All Coverage Artifacts
        uses: actions/download-artifact@v8
        with:
          path: coverage-data
          pattern: coverage-*
          merge-multiple: false

      - name: Aggregate & Generate Coverage Summary
        run: |
          python3 tools/report_coverage.py coverage-data --min-coverage 80.0

      - name: Post Sticky Coverage Comment on Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage-summary.md')) return;
            const body = fs.readFileSync('coverage-summary.md', 'utf8');
            const commentHeader = '## 📊 Code Coverage Summary';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            const botComment = comments.data.find(c => c.body.includes(commentHeader));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Evaluate Pipeline Status
        run: |
          build_result="${{ needs.build.result }}"
          e2e_result="${{ needs.e2e.result }}"
          echo "Build Matrix Result: $build_result"
          echo "E2E Matrix Result: $e2e_result"
          if [[ "$build_result" == "success" && "$e2e_result" == "success" ]]; then
            echo "All required checks passed."
            exit 0
          else
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi

  deploy-pages:
    name: Assemble & Deploy Repositories to GitHub Pages
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    needs: [build, e2e, github-release]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download All Built Debian Packages
        uses: actions/download-artifact@v8
        with:
          path: all-debs
          pattern: deb-*
          merge-multiple: true

      - name: Download All Built RPM Packages
        uses: actions/download-artifact@v8
        with:
          path: all-rpms
          pattern: rpm-*
          merge-multiple: true

      - name: Verify Package Digests Against Published GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/verify_release_digests.py --deb-dir all-debs --rpm-dir all-rpms

      - name: Assemble APT & RPM Repositories
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          python3 tools/generate_apt_repo.py --deb-dir all-debs --rpm-dir all-rpms --output-dir pages --owner ${{ github.repository_owner }} --repo ${{ github.event.repository.name }}
          python3 tools/generate_rpm_repo.py --rpm-dir all-rpms --output-dir pages/rpm --owner ${{ github.repository_owner }} --repo ${{ github.event.repository.name }}

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  github-release:
    name: Publish Tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs: [build, e2e]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download All Built Debian Packages
        uses: actions/download-artifact@v8
        with:
          path: all-debs
          pattern: deb-*
          merge-multiple: true

      - name: Download All Built RPM Packages
        uses: actions/download-artifact@v8
        with:
          path: all-rpms
          pattern: rpm-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Creating GitHub Release for $TAG_NAME..."
          gh release create "$TAG_NAME" \
            all-debs/*.deb \
            all-rpms/*.rpm \
            --title "$TAG_NAME" \
            --generate-notes
