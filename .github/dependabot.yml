version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@patternfly/*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-root:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/packages/common"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@patternfly/*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-common:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/plugins/zfs-storage"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@patternfly/*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-zfs:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/plugins/file-sharing"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@patternfly/*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-file-sharing:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/plugins/container-manager"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@patternfly/*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-container-manager:
        patterns: ["*"]

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      devcontainers:
        patterns: ["*"]
